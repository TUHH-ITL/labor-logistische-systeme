name: Build und Push der Seminar-Images

# Studierende bauen nie selbst. Die Images entstehen hier und liegen fertig
# in der GitHub Container Registry.

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Basis-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          # arm64 mitbauen, damit Apple Silicon nicht emulieren muss.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy-base
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sim:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Simulations-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.sim
          # Gazebo auf arm64 lohnt sich nicht, daher nur amd64.
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy-base
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy-sim
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vnc:
    needs: base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: noVNC-Image bauen, auf Basis-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.vnc
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy-base
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy-vnc
          cache-from: type=gha
          cache-to: type=gha,mode=max

  vnc-sim:
    needs: sim
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: noVNC-Image bauen, auf Simulations-Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.vnc
          # Basiert auf jazzy-sim, das es nur für amd64 gibt.
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy-sim
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:jazzy-vnc-sim
          cache-from: type=gha
          cache-to: type=gha,mode=max
